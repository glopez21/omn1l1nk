services:
  omn1l1nk:
    build: .
    container_name: omn1l1nk
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      OMN1L1NK_DB_URL: "postgresql+asyncpg://omn1l1nk_user:changeme_omn1l1nk@n3xusdb:5432/shared_db"
      OMN1L1NK_AUGUR_URL: "http://augur-api-1:8000"
      OMN1L1NK_AUGUR_ENABLED: "true"
      OMN1L1NK_THREATPULSE_ENABLED: "false"
      OMN1L1NK_POLL_INTERVAL: "3"
      OMN1L1NK_BATCH_SIZE: "50"
      OMN1L1NK_MAX_RETRIES: "5"
      OMN1L1NK_LOG_LEVEL: "INFO"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, json; r = urllib.request.urlopen('http://localhost:9000/health'); assert json.loads(r.read())['status'] == 'healthy'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - n3xus-net
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "128M"

networks:
  n3xus-net:
    name: n3xus-net
    external: true
