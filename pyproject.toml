[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omn1l1nk"
version = "0.1.0"
description = "Unified event delivery pipeline — connects n3xusDB to Augur and ThreatPulse"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "aiofiles>=24.0",
]

[project.scripts]
omn1l1nk = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app/"]
