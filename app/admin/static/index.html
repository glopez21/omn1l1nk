<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omn1L1nk Admin</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface-2: #1a1a26;
    --surface-3: #22223a;
    --border: #2a2a3e;
    --text: #e0e0f0;
    --text-dim: #6b6b8a;
    --accent: #6366f1;
    --accent-glow: rgba(99,102,241,0.15);
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #eab308;
    --cyan: #22d3ee;
    --rad: 8px;
    --transition: all 0.2s ease;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 50;
    backdrop-filter: blur(12px);
  }
  .app-header h1 {
    font-size: 18px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .app-header h1 span { font-weight: 400; opacity: 0.5; -webkit-text-fill-color: var(--text-dim); }
  .header-status { display: flex; align-items: center; gap: 20px; font-size: 13px; }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px;
  }
  .status-dot.green { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .status-dot.red { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .status-dot.yellow { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }

  .nav {
    display: flex; gap: 2px; padding: 12px 28px 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .nav button {
    background: transparent; border: none; color: var(--text-dim); padding: 10px 20px;
    cursor: pointer; font-size: 13px; font-weight: 500;
    border-bottom: 2px solid transparent; transition: var(--transition);
    font-family: inherit;
  }
  .nav button:hover { color: var(--text); background: var(--surface-2); }
  .nav button.active { color: var(--accent); border-bottom-color: var(--accent); }

  .content { padding: 20px 28px; max-width: 1400px; margin: 0 auto; }
  .panel { display: none; }
  .panel.active { display: block; }

  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--rad); padding: 16px;
    transition: var(--transition); position: relative; overflow: hidden;
  }
  .stat-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
    opacity: 0;
    transition: var(--transition);
  }
  .stat-card:hover::before { opacity: 1; }
  .stat-card:hover { border-color: var(--surface-3); transform: translateY(-1px); }
  .stat-card .label { font-size: 11px; text-transform: uppercase; color: var(--text-dim); letter-spacing: 0.5px; margin-bottom: 6px; }
  .stat-card .value { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-card .value.green { color: var(--green); }
  .stat-card .value.red { color: var(--red); }
  .stat-card .value.yellow { color: var(--yellow); }
  .stat-card .value.cyan { color: var(--cyan); }
  .stat-card .sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

  .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .chart-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--rad); padding: 16px;
  }
  .chart-box h3 { font-size: 13px; font-weight: 600; margin-bottom: 12px; color: var(--text-dim); }
  .chart-box canvas { max-height: 200px; }

  .section-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
  }
  .section-header h2 { font-size: 15px; font-weight: 600; }
  .section-header .pill {
    font-size: 11px; padding: 3px 10px; border-radius: 10px; background: var(--surface-2);
    color: var(--text-dim);
  }

  table {
    width: 100%; border-collapse: separate; border-spacing: 0;
    background: var(--surface); border-radius: var(--rad); overflow: hidden; font-size: 13px;
    border: 1px solid var(--border);
  }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  th {
    background: var(--surface-2); font-size: 11px; text-transform: uppercase; color: var(--text-dim);
    letter-spacing: 0.3px; font-weight: 600;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface-2); }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600;
  }
  .badge.green { background: rgba(34,197,94,0.15); color: var(--green); }
  .badge.red { background: rgba(239,68,68,0.15); color: var(--red); }
  .badge.yellow { background: rgba(234,179,8,0.15); color: var(--yellow); }
  .badge.slate { background: rgba(100,116,139,0.15); color: #94a3b8; }
  .badge.cyan { background: rgba(34,211,238,0.15); color: var(--cyan); }

  .btn {
    background: var(--accent); border: none; color: #fff; padding: 7px 16px; border-radius: var(--rad);
    cursor: pointer; font-size: 12px; font-weight: 500; transition: var(--transition);
    font-family: inherit;
  }
  .btn:hover { background: #5558e6; box-shadow: 0 0 12px var(--accent-glow); }
  .btn.danger { background: var(--red); }
  .btn.danger:hover { background: #dc2626; }
  .btn.small { padding: 5px 12px; font-size: 11px; }
  .action-btn {
    background: transparent; border: none; color: var(--text-dim); cursor: pointer;
    font-size: 12px; padding: 4px 10px; border-radius: 4px; transition: var(--transition);
    font-family: inherit; font-weight: 500; margin: 0 2px;
  }
  .action-btn:hover { background: var(--surface-3); color: var(--text); }
  .action-btn.edit:hover { background: rgba(99,102,241,0.15); color: var(--accent); }
  .action-btn.delete:hover { background: rgba(239,68,68,0.15); color: var(--red); }
  .action-btn.toggle:hover { background: rgba(234,179,8,0.15); color: var(--yellow); }
  .action-btn + .action-btn { margin-left: 0; }
  td:last-child { white-space: nowrap; }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    z-index: 100; backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; align-items: center; justify-content: center; }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--rad);
    padding: 24px; min-width: 420px; max-width: 640px; width: 100%; max-height: 80vh; overflow-y: auto;
    animation: modalIn 0.2s ease;
  }
  @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .modal h2 { margin-bottom: 16px; font-size: 16px; }
  .modal label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; margin-top: 8px; }
  .modal input, .modal textarea, .modal select {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 9px 12px; border-radius: var(--rad); margin-bottom: 8px; font-size: 13px; font-family: inherit;
    transition: var(--transition);
  }
  .modal input:focus, .modal textarea:focus, .modal select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .modal textarea { min-height: 60px; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .key-display {
    background: var(--bg); border: 1px solid var(--yellow); border-radius: var(--rad);
    padding: 12px; margin: 12px 0; word-break: break-all; font-family: monospace; font-size: 13px;
  }
  .toast {
    position: fixed; bottom: 24px; right: 24px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--rad); padding: 12px 20px;
    font-size: 13px; z-index: 200; display: none; animation: toastIn 0.3s ease;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .toast.show { display: block; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  .live-event {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--rad);
    padding: 12px 16px; margin-bottom: 6px; font-size: 13px;
    display: flex; align-items: center; gap: 12px;
    animation: slideIn 0.2s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
  .event-time { color: var(--text-dim); font-size: 11px; font-family: monospace; white-space: nowrap; }
  .event-source { font-weight: 600; min-width: 80px; }
  .event-type { color: var(--cyan); }
  .event-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .empty-state { text-align: center; padding: 40px; color: var(--text-dim); font-size: 14px; }

  .loading { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 768px) {
    .content { padding: 12px 16px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .charts-row { grid-template-columns: 1fr; }
    .app-header { flex-direction: column; gap: 8px; }
    .modal { min-width: unset; margin: 16px; }
  }
</style>
</head>
<body>

<div class="app-header">
  <h1>Omn1L1nk <span>Admin</span></h1>
  <div class="header-status">
    <span id="header-status"><span class="status-dot yellow"></span>connecting...</span>
    <span id="header-depth" style="color:var(--text-dim)">queue: --</span>
  </div>
</div>

<div class="nav">
  <button class="active" data-tab="dashboard">Dashboard</button>
  <button data-tab="events">Live Events</button>
  <button data-tab="keys">API Keys</button>
  <button data-tab="rules">Enrich Rules</button>
  <button data-tab="queue">Queue</button>
</div>

<div class="content">

<!-- ─── Dashboard ─── -->
<div id="panel-dashboard" class="panel active">
  <div class="stats-grid" id="stats-cards"></div>
  <div class="charts-row">
    <div class="chart-box">
      <h3>Delivery Rate (last 60s)</h3>
      <canvas id="chart-delivery"></canvas>
    </div>
    <div class="chart-box">
      <h3>Queue by Severity</h3>
      <canvas id="chart-severity"></canvas>
    </div>
  </div>
</div>

<!-- ─── Live Events ─── -->
<div id="panel-events" class="panel">
  <div class="section-header">
    <h2>Live Event Stream</h2>
    <span class="pill" id="event-count">0 events</span>
  </div>
  <div id="event-stream"><div class="empty-state">Waiting for events...</div></div>
</div>

<!-- ─── API Keys ─── -->
<div id="panel-keys" class="panel">
  <div class="section-header">
    <h2>API Keys</h2>
    <button class="btn" id="add-key-btn">+ New Key</button>
  </div>
  <table><thead><tr>
    <th>Label</th><th>Source</th><th>Instance</th><th>Status</th><th>Created</th><th></th>
  </tr></thead><tbody id="keys-tbody"></tbody></table>
</div>

<!-- ─── Enrich Rules ─── -->
<div id="panel-rules" class="panel">
  <div class="section-header">
    <h2>Enrich Rules</h2>
    <button class="btn" id="add-rule-btn">+ New Rule</button>
  </div>
  <table><thead><tr>
    <th>Priority</th><th>Name</th><th>Match</th><th>Enrich</th><th>Status</th><th></th>
  </tr></thead><tbody id="rules-tbody"></tbody></table>
</div>

<!-- ─── Queue ─── -->
<div id="panel-queue" class="panel">
  <div class="section-header">
    <h2>Event Queue</h2>
    <span class="pill">last 50 events</span>
  </div>
  <table><thead><tr>
    <th>ID</th><th>Source</th><th>Type</th><th>Severity</th><th>Title</th><th>Pushed</th><th>Attempts</th><th>Error</th>
  </tr></thead><tbody id="queue-tbody"></tbody></table>
</div>

</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = '/api/v1/admin';
let deliveryChart = null, severityChart = null;
let dashboardTimer = null, eventTimer = null;
let eventsBuffer = [];
const MAX_EVENTS = 100;
const DELIVERY_HISTORY = [];
const MAX_HISTORY = 20;

// ─── Helpers ────────────────────────────────────────────

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._hide);
  el._hide = setTimeout(() => el.classList.remove('show'), 3000);
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json', ...opts.headers },
    ...opts,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: res.statusText }));
    throw new Error(err.detail || 'request failed');
  }
  if (res.status === 204) return null;
  return res.json();
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function modal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeModal();
});

// ─── Navigation ─────────────────────────────────────────

document.querySelectorAll('.nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    loadTab(btn.dataset.tab);
  });
});

function loadTab(tab) {
  clearInterval(dashboardTimer);
  clearInterval(eventTimer);
  if (tab === 'dashboard') { loadDashboard(); dashboardTimer = setInterval(loadDashboard, 5000); }
  else if (tab === 'events') { loadEvents(); eventTimer = setInterval(loadEvents, 3000); }
  else if (tab === 'keys') loadKeys();
  else if (tab === 'rules') loadRules();
  else if (tab === 'queue') loadQueue();
}

// ─── Charts ─────────────────────────────────────────────

function initCharts() {
  const ctx1 = document.getElementById('chart-delivery').getContext('2d');
  deliveryChart = new Chart(ctx1, {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        label: 'Rate/min',
        data: [],
        borderColor: '#6366f1',
        backgroundColor: 'rgba(99,102,241,0.1)',
        fill: true,
        tension: 0.4,
        pointRadius: 2,
        borderWidth: 2,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { display: false },
        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#6b6b8a' } }
      }
    }
  });

  const ctx2 = document.getElementById('chart-severity').getContext('2d');
  severityChart = new Chart(ctx2, {
    type: 'doughnut',
    data: {
      labels: ['Low', 'Medium', 'High', 'Critical'],
      datasets: [{
        data: [0, 0, 0, 0],
        backgroundColor: ['#94a3b8', '#eab308', '#ef4444', '#7f1d1d'],
        borderWidth: 0,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'right',
          labels: { color: '#6b6b8a', boxWidth: 10, padding: 8, font: { size: 11 } }
        }
      },
      cutout: '60%',
    }
  });
}

function updateCharts(health, stats) {
  const now = new Date().toLocaleTimeString();
  DELIVERY_HISTORY.push({ time: now, rate: health.delivery_rate_per_min });
  if (DELIVERY_HISTORY.length > MAX_HISTORY) DELIVERY_HISTORY.shift();

  deliveryChart.data.labels = DELIVERY_HISTORY.map(d => d.time);
  deliveryChart.data.datasets[0].data = DELIVERY_HISTORY.map(d => d.rate);
  deliveryChart.update('none');

  if (stats && stats.by_severity) {
    severityChart.data.datasets[0].data = [
      stats.by_severity.low || 0,
      stats.by_severity.medium || 0,
      stats.by_severity.high || 0,
      stats.by_severity.critical || 0,
    ];
    severityChart.update('none');
  }
}

// ─── Dashboard ──────────────────────────────────────────

async function loadDashboard() {
  try {
    const [health, stats] = await Promise.all([
      fetch('/health').then(r => r.json()),
      api('/stats'),
    ]);

    const statusEl = document.getElementById('header-status');
    const dot = health.status === 'healthy' ? 'green' : 'red';
    statusEl.innerHTML = `<span class="status-dot ${dot}"></span>${health.status}`;
    document.getElementById('header-depth').textContent = `queue: ${stats.queue_depth}`;

    document.getElementById('stats-cards').innerHTML = `
      <div class="stat-card">
        <div class="label">System Status</div>
        <div class="value ${health.status === 'healthy' ? 'green' : 'red'}">${health.status}</div>
        <div class="sub">n3xusDB: ${health.n3xusdb_status}</div>
      </div>
      <div class="stat-card">
        <div class="label">Queue Depth</div>
        <div class="value ${stats.queue_depth > 100 ? 'red' : stats.queue_depth > 10 ? 'yellow' : 'green'}">${stats.queue_depth}</div>
        <div class="sub">${health.oldest_unpushed_seconds ? Math.round(health.oldest_unpushed_seconds) + 's oldest' : 'empty'}</div>
      </div>
      <div class="stat-card">
        <div class="label">Delivery Rate</div>
        <div class="value cyan">${health.delivery_rate_per_min}</div>
        <div class="sub">per minute</div>
      </div>
      <div class="stat-card">
        <div class="label">Error Rate</div>
        <div class="value ${health.error_rate_per_min > 0 ? 'red' : 'green'}">${health.error_rate_per_min}</div>
        <div class="sub">per minute</div>
      </div>
      <div class="stat-card">
        <div class="label">Total Events</div>
        <div class="value">${stats.total_events}</div>
        <div class="sub">all time</div>
      </div>
      <div class="stat-card">
        <div class="label">Failed Events</div>
        <div class="value ${stats.failed.count > 0 ? 'red' : 'green'}">${stats.failed.count}</div>
        <div class="sub">${stats.failed.oldest ? 'oldest: ' + new Date(stats.failed.oldest).toLocaleString() : 'none'}</div>
      </div>
      <div class="stat-card">
        <div class="label">Augur</div>
        <div class="value ${health.augur_status === 'reachable' ? 'green' : health.augur_status === 'unknown' ? 'yellow' : 'red'}">${health.augur_status}</div>
      </div>
      <div class="stat-card">
        <div class="label">ThreatPulse</div>
        <div class="value ${health.threatpulse_status === 'reachable' ? 'green' : health.threatpulse_status === 'unknown' ? 'yellow' : 'red'}">${health.threatpulse_status}</div>
      </div>
    `;

    updateCharts(health, stats);
  } catch (e) {
    document.getElementById('stats-cards').innerHTML =
      `<div class="stat-card"><div class="value red" style="font-size:14px">Error: ${esc(e.message)}</div></div>`;
  }
}

// ─── Live Events ────────────────────────────────────────

async function loadEvents() {
  try {
    const data = await api('/events?limit=10&offset=0&pushed=false');
    const container = document.getElementById('event-stream');
    const countEl = document.getElementById('event-count');

    if (!data.items.length) {
      countEl.textContent = '0 events';
      if (!container.querySelector('.empty-state')) {
        container.innerHTML = '<div class="empty-state">No pending events — stream is idle</div>';
      }
      return;
    }

    countEl.textContent = `${data.total} pending`;

    for (const e of data.items) {
      const key = e.id;
      if (eventsBuffer.includes(key)) continue;
      eventsBuffer.unshift(key);
      if (eventsBuffer.length > MAX_EVENTS) eventsBuffer.pop();

      const card = document.createElement('div');
      card.className = 'live-event';
      card.innerHTML = `
        <span class="event-time">${new Date(e.created_at).toLocaleTimeString()}</span>
        <span class="badge ${e.severity === 'critical' ? 'red' : e.severity === 'high' ? 'yellow' : e.severity === 'medium' ? 'yellow' : 'slate'}">${e.severity}</span>
        <span class="event-source">${esc(e.source)}</span>
        <span class="event-type">${esc(e.event_type)}</span>
        <span class="event-title">${esc(e.title)}</span>
        <span class="badge ${e.pushed ? 'green' : 'red'}">${e.pushed ? 'pushed' : 'pending'}</span>
      `;
      container.insertBefore(card, container.firstChild);

      const items = container.querySelectorAll('.live-event');
      if (items.length > 20) items[items.length - 1].remove();
    }
  } catch (_) {}
}

// ─── API Keys ───────────────────────────────────────────

async function loadKeys() {
  try {
    const keys = await api('/api-keys');
    document.getElementById('keys-tbody').innerHTML = keys.map(k => `
      <tr>
        <td><strong>${esc(k.label)}</strong></td>
        <td>${esc(k.source)}</td>
        <td>${esc(k.source_instance)}</td>
        <td><span class="badge ${k.enabled ? 'green' : 'red'}">${k.enabled ? 'enabled' : 'disabled'}</span></td>
        <td style="color:var(--text-dim);font-size:12px">${new Date(k.created_at).toLocaleDateString()}</td>
        <td>
          <button class="action-btn toggle" onclick="toggleKey('${k.id}', ${!k.enabled})">${k.enabled ? 'Disable' : 'Enable'}</button>
          <button class="action-btn delete" onclick="deleteKey('${k.id}')">Delete</button>
        </td>
      </tr>
    `).join('');
  } catch (e) {
    document.getElementById('keys-tbody').innerHTML =
      `<tr><td colspan="6" style="color:var(--red);padding:20px">${esc(e.message)}</td></tr>`;
  }
}

async function toggleKey(id, enabled) {
  await api(`/api-keys/${id}`, { method: 'PATCH', body: JSON.stringify({ enabled }) });
  toast(`Key ${enabled ? 'enabled' : 'disabled'}`);
  loadKeys();
}

async function deleteKey(id) {
  if (!confirm('Delete this API key?')) return;
  await api(`/api-keys/${id}`, { method: 'DELETE' });
  toast('Key deleted');
  loadKeys();
}

document.getElementById('add-key-btn').addEventListener('click', () => {
  modal(`
    <h2>Create API Key</h2>
    <label>Label</label><input id="f-key-label" placeholder="e.g. dev-box-01">
    <label>Source</label><input id="f-key-source" placeholder="e.g. logsentry">
    <label>Source Instance</label><input id="f-key-instance" placeholder="e.g. dev-box">
    <div id="key-result" style="display:none">
      <label style="color:var(--yellow)">Save this key — it won't be shown again</label>
      <div class="key-display" id="key-value"></div>
    </div>
    <div class="actions">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" id="create-key-btn">Create</button>
    </div>
  `);
  document.getElementById('create-key-btn').addEventListener('click', async () => {
    const label = document.getElementById('f-key-label').value.trim();
    const source = document.getElementById('f-key-source').value.trim();
    const instance = document.getElementById('f-key-instance').value.trim();
    if (!label || !source || !instance) { toast('All fields required'); return; }
    try {
      const result = await api('/api-keys', {
        method: 'POST',
        body: JSON.stringify({ label, source, source_instance: instance }),
      });
      document.getElementById('key-result').style.display = 'block';
      document.getElementById('key-value').textContent = result.key;
      document.getElementById('create-key-btn').style.display = 'none';
      toast('Key created');
      loadKeys();
    } catch (e) { toast(e.message); }
  });
});

// ─── Enrich Rules ───────────────────────────────────────

async function loadRules() {
  try {
    const rules = await api('/rules');
    document.getElementById('rules-tbody').innerHTML = rules.map(r => `
      <tr>
        <td style="color:var(--text-dim)">${r.priority}</td>
        <td><strong>${esc(r.name)}</strong></td>
        <td><code style="font-size:11px;color:var(--text-dim)">${esc(JSON.stringify(r.match))}</code></td>
        <td><code style="font-size:11px;color:var(--text-dim)">${esc(JSON.stringify(r.enrich))}</code></td>
        <td><span class="badge ${r.enabled ? 'green' : 'red'}">${r.enabled ? 'enabled' : 'disabled'}</span></td>
        <td>
          <button class="action-btn edit" onclick="editRule('${r.id}')">Edit</button>
          <button class="action-btn delete" onclick="deleteRule('${r.id}')">Delete</button>
        </td>
      </tr>
    `).join('');
  } catch (e) {
    document.getElementById('rules-tbody').innerHTML =
      `<tr><td colspan="6" style="color:var(--red);padding:20px">${esc(e.message)}</td></tr>`;
  }
}

async function deleteRule(id) {
  if (!confirm('Delete this rule?')) return;
  await api(`/rules/${id}`, { method: 'DELETE' });
  toast('Rule deleted');
  loadRules();
}

function editRule(id) {
  api('/rules').then(rules => {
    const rule = rules.find(r => r.id === id);
    if (!rule) return;
    modal(`
      <h2>Edit Rule</h2>
      <label>Name</label><input id="f-rule-name" value="${esc(rule.name)}">
      <label>Match (JSON)</label><textarea id="f-rule-match" rows="3">${esc(JSON.stringify(rule.match, null, 2))}</textarea>
      <label>Enrich (JSON)</label><textarea id="f-rule-enrich" rows="3">${esc(JSON.stringify(rule.enrich, null, 2))}</textarea>
      <label>Priority</label><input id="f-rule-priority" type="number" value="${rule.priority}">
      <label>Enabled</label>
      <select id="f-rule-enabled">
        <option value="true" ${rule.enabled ? 'selected' : ''}>Yes</option>
        <option value="false" ${!rule.enabled ? 'selected' : ''}>No</option>
      </select>
      <div class="actions">
        <button class="btn ghost" onclick="closeModal()">Cancel</button>
        <button class="btn" id="save-rule-btn">Save</button>
      </div>
    `);
    document.getElementById('save-rule-btn').addEventListener('click', async () => {
      try {
        await api(`/rules/${id}`, {
          method: 'PATCH',
          body: JSON.stringify({
            name: document.getElementById('f-rule-name').value.trim(),
            match: JSON.parse(document.getElementById('f-rule-match').value),
            enrich: JSON.parse(document.getElementById('f-rule-enrich').value),
            priority: parseInt(document.getElementById('f-rule-priority').value),
            enabled: document.getElementById('f-rule-enabled').value === 'true',
          }),
        });
        toast('Rule updated');
        closeModal();
        loadRules();
      } catch (e) { toast(e.message); }
    });
  });
}

document.getElementById('add-rule-btn').addEventListener('click', () => {
  modal(`
    <h2>New Enrich Rule</h2>
    <label>Name</label><input id="f-rule-name" placeholder="e.g. SSH brute force scoring">
    <label>Match (JSON)</label><textarea id="f-rule-match" rows="3" placeholder='{"source": "logsentry", "event_type": "ssh_bruteforce"}'></textarea>
    <label>Enrich (JSON)</label><textarea id="f-rule-enrich" rows="3" placeholder='{"severity": "high", "confidence": 0.85, "tags": ["high_fidelity"]}'></textarea>
    <label>Priority</label><input id="f-rule-priority" type="number" value="100">
    <div class="actions">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" id="save-rule-btn">Create</button>
    </div>
  `);
  document.getElementById('save-rule-btn').addEventListener('click', async () => {
    try {
      await api('/rules', {
        method: 'POST',
        body: JSON.stringify({
          name: document.getElementById('f-rule-name').value.trim(),
          match: JSON.parse(document.getElementById('f-rule-match').value),
          enrich: JSON.parse(document.getElementById('f-rule-enrich').value),
          priority: parseInt(document.getElementById('f-rule-priority').value) || 100,
        }),
      });
      toast('Rule created');
      closeModal();
      loadRules();
    } catch (e) { toast(e.message); }
  });
});

// ─── Queue ──────────────────────────────────────────────

async function loadQueue() {
  try {
    const data = await api('/events?limit=50&offset=0');
    document.getElementById('queue-tbody').innerHTML = data.items.map(e => `
      <tr>
        <td style="font-family:monospace;font-size:11px;color:var(--text-dim)">${e.id.slice(0, 8)}</td>
        <td>${esc(e.source)}</td>
        <td>${esc(e.event_type)}</td>
        <td><span class="badge
          ${e.severity === 'critical' ? 'red' : e.severity === 'high' ? 'yellow' : e.severity === 'medium' ? 'yellow' : 'slate'}
        ">${e.severity}</span></td>
        <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.title)}</td>
        <td>${e.pushed ? '<span class="badge green">yes</span>' : '<span class="badge red">no</span>'}</td>
        <td>${e.delivery_attempts}</td>
        <td style="color:var(--text-dim);font-size:11px">${e.error ? esc(e.error) : ''}</td>
      </tr>
    `).join('');
  } catch (e) {
    document.getElementById('queue-tbody').innerHTML =
      `<tr><td colspan="8" style="color:var(--red);padding:20px">${esc(e.message)}</td></tr>`;
  }
}

// ─── Init ───────────────────────────────────────────────

initCharts();
loadDashboard();
dashboardTimer = setInterval(loadDashboard, 5000);
</script>
</body>
</html>
